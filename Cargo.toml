[package]
name = "cthread"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.9", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
libc = "0.2.191"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
shell-words = "1.1.1"
toml = "1.2.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
uuid = { version = "1.29.3", features = ["v4"] }
vt100 = "0.18.1"

[dev-dependencies]
insta = "1.49.0"
shell-words = "1.1.1"
tempfile = "3.27.0"

[workspace]
members = [".", "tests/fake-claude"]

[profile.release]
lto = "thin"
strip = true
