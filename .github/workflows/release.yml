name: release

# Push a tag like v0.1.0 to build binaries and publish a GitHub release.
# install.sh downloads the assets this workflow uploads, so keep the
# asset names (cthread-<target>.tar.gz and .sha256) in sync with it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches Cargo.toml version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
      - run: cargo test --workspace

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          # musl builds are static, so they run on any Linux distro.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p cthread
      - name: Smoke test
        run: target/${{ matrix.target }}/release/cthread --version
      - name: Package
        shell: bash
        run: |
          name=cthread-${{ matrix.target }}
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/$name.tar.gz cthread
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum $name.tar.gz > $name.tar.gz.sha256
          else shasum -a 256 $name.tar.gz > $name.tar.gz.sha256; fi
          cat $name.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: cthread-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
          fi

  # Install the just-published release the way users do.
  verify-install:
    needs: release
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: curl | bash
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/$TAG/install.sh" \
            | CTHREAD_VERSION="$TAG" bash
          ~/.local/bin/cthread --version | grep -q "${TAG#v}"
